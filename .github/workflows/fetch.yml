name: fetch-from-pod
on:
  workflow_dispatch:
    inputs:
      base:  {description: "pod file server base URL incl. secret path", required: true}
      files: {description: "space-separated relative paths", required: true}
      dest:  {description: "folder in repo", required: true, default: "results"}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: |
          mkdir -p "${{ inputs.dest }}"
          for f in ${{ inputs.files }}; do
            mkdir -p "${{ inputs.dest }}/$(dirname "$f")"
            curl -fsSL --retry 3 -o "${{ inputs.dest }}/$f" "${{ inputs.base }}/$f"
          done
          ls -la "${{ inputs.dest }}"
      - name: commit
        run: |
          git config user.name "pod-fetch"; git config user.email "pod-fetch@users.noreply.github.com"
          git add "${{ inputs.dest }}"
          git commit -m "fetch from pod: ${{ inputs.dest }}" || echo "nothing new"
          git push
